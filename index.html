<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-SIM Fronteiras</title>
<style>
:root{--navy:#1A2540;--bg:#F2F4F8;--border:#D8DCE4;--text:#444A5A;--muted:#8B92A4;--ok:#1B9E4B;--okbg:#E6F4EC;--warn:#E0A800;--warnbg:#FFF7E0;--bad:#C62828;--badbg:#FCEBEB;--purple:#7C3AED;--purplebg:#F1EBFF;--blue:#2563EB;--bluebg:#EBF1FF;--orange:#EA580C;--orangebg:#FFEDD5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
header{background:linear-gradient(135deg,#1A2540,#2E3E6B);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:56px}
header h1{font-size:17px;margin:0;letter-spacing:.2px}
header .meta{font-size:12px;opacity:.75}
header input{margin-left:auto;width:280px;max-width:100%;padding:7px 10px;border-radius:6px;border:0;font:inherit}
.app{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 56px)}
aside{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;font:600 12px system-ui,sans-serif;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--navy);border-color:var(--purple)}
.panel{overflow:auto;padding:14px 16px 30px;flex:1;display:none}
.panel.active{display:block}
main{position:relative;min-height:0;overflow:hidden;background:#EEF1F6}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
h2{font-size:18px;color:var(--navy);margin:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px}
.rhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhead .id{color:var(--muted)}
.rhead a.ext{margin-left:auto;font-size:12px;color:var(--blue)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kv div{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center}
.stats b{display:block;font-size:18px;color:var(--navy)}
.stats small{color:var(--muted);font-size:11px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:#8a6700}.b-bad{background:var(--badbg);color:var(--bad)}.b-pur{background:var(--purplebg);color:var(--purple)}.b-blue{background:var(--bluebg);color:var(--blue)}.b-or{background:var(--orangebg);color:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 5px;border:1px solid var(--border);border-radius:99px;background:#fff;cursor:pointer;margin:0 4px 4px 0;font-size:12px;white-space:nowrap}
.chip:hover{border-color:var(--navy)}
.chip i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.chip .n{color:var(--muted);font-size:11px}
.chip .x{color:var(--bad);font-weight:700;margin-left:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:4px 4px;border-bottom:1px solid var(--border);position:sticky;top:-14px;background:#fff}
td{padding:4px 4px;border-bottom:1px solid #EEF0F4;vertical-align:top}
tr.grp td{background:var(--bg);font-weight:600;color:var(--navy);padding-top:6px}
a.rg{color:var(--blue);cursor:pointer;text-decoration:none}
a.rg:hover{text-decoration:underline}
.res{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--orangebg);color:var(--orange)}
.tag.own{background:var(--okbg);color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{font-size:12px;color:var(--muted);min-width:70px}
select,input[type=text],input[list]{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);flex:1;min-width:0}
button.btn{font:600 12px system-ui,sans-serif;padding:7px 12px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
button.btn.sec{background:#fff;color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font:600 12px system-ui,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.verdict{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--purplebg);border-left:4px solid var(--purple);color:var(--navy);font-size:12.5px}
ol.path{padding-left:22px;margin:8px 0}
ol.path li{padding:3px 0}
.pair{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff}
.pair>.ph{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer}
.pair>.ph .cnt{margin-left:auto;font-weight:700;color:var(--navy)}
.pair.open{border-color:var(--purple)}
.pair .pb{display:none;padding:0 8px 8px}
.pair.open .pb{display:block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 4px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:11.5px;margin:0 3px 3px 0;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--navy)}
.pill.f{border-color:#F5B48A;background:var(--orangebg)}
.pill.o{color:var(--muted)}
.pill.c{border-color:#9CC9AE;background:var(--okbg)}
.oc{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff}
.oc .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.oc .t b{color:var(--navy);cursor:pointer;font-size:13px}
.oc .t b:hover{text-decoration:underline}
.oc.sel{border-color:var(--purple);box-shadow:0 0 0 2px var(--purplebg)}
.oc .nbs{margin-top:6px}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.toolbar>*{pointer-events:auto}
.tb{background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:8px;padding:4px;display:flex;gap:4px;align-items:center;box-shadow:0 1px 4px rgba(26,37,64,.08)}
.tb button{border:0;background:none;padding:5px 9px;border-radius:5px;font:600 12px system-ui,sans-serif;color:var(--text);cursor:pointer}
.tb button.on{background:var(--navy);color:#fff}
.tb button:hover:not(.on){background:var(--bg)}
.legend{position:absolute;left:10px;bottom:10px;max-height:45%;width:230px;overflow:auto;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 1px 4px rgba(26,37,64,.08)}
.legend .li{display:flex;align-items:center;gap:6px;padding:1px 0;cursor:pointer}
.legend .li:hover{color:var(--navy);font-weight:600}
.legend .li .n{margin-left:auto;color:var(--muted)}
.legend.hide .body{display:none}
.legend .lt{font-weight:700;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between}
#tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;display:none;max-width:260px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#tip small{opacity:.75}
.help{position:absolute;right:10px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
@media (max-width:860px){
 .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
 main{order:-1;height:62vh}
 aside{border-right:0;border-top:1px solid var(--border)}
 .panel{max-height:none}
 header input{margin-left:0;width:100%}
 .legend{width:170px;max-height:35%}
}
</style>
</head>

  for(const s of members){ if(!inS[s]||seen[s]) continue;
    const comp=[s]; seen[s]=1;
    for(let k=0;k<comp.length;k++){const u=comp[k];
      for(const v of R[u].nb){ if(!inS[v]||seen[v]) continue;
        if(skipEdge&&((u===skipEdge[0]&&v===skipEdge[1])||(u===skipEdge[1]&&v===skipEdge[0]))) continue;
        seen[v]=1; comp.push(v);}}
    out.push(comp);}
  return out.sort((a,b)=>b.length-a.length);
}
const ALL=R.map(r=>r.i);

// Dijkstra simples (N≈1000): custo = 1000 por região a conquistar + 1 por salto
function dijkstra(sources, side, mode){
  const dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1), done=new Uint8Array(N);
  sources.forEach(s=>dist[s]=0);
  for(;;){ let u=-1,b=Infinity; for(let i=0;i<N;i++) if(!done[i]&&dist[i]<b){b=dist[i];u=i;}
    if(u<0) break; done[u]=1;
    for(const v of R[u].nb){ const w=mode==='hops'?1:(side.has(R[v].owner)?1:1001);
      if(dist[u]+w<dist[v]){dist[v]=dist[u]+w; prev[v]=u;}}}
  return {dist,prev};
}

// ---------- canvas ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), mainEl=document.getElementById('main'), tip=document.getElementById('tip');
let W=0,H=0,dpr=1, cam={x:0,y:0,s:10}, colorMode='owner', allLabels=false, view=null, hover=-1;
let userMoved=false;
function resize(){dpr=window.devicePixelRatio||1; W=mainEl.clientWidth; H=mainEl.clientHeight; cv.width=W*dpr; cv.height=H*dpr; if(!userMoved&&W&&H) fit(view?view.focus:ALL,view?60:30); else redraw();}
let raf=0; function redraw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0; draw();}); }
const nodeColor=r=>colorMode==='res'?(r.res?RESC[r.res]:'#C9CED8'):COL[colorMode==='owner'?r.owner:r.rightful];
function fit(idx, pad=60){
  if(!idx||!idx.length) idx=ALL;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  idx.forEach(i=>{const r=R[i]; x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x); y1=Math.max(y1,r.y);});
  const w=Math.max(x1-x0,4), h=Math.max(y1-y0,4);
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2; cam.s=Math.min((W-pad*2)/w,(H-pad*2-40)/h, 45);
  redraw();
}
const sx=r=>(r.x-cam.x)*cam.s+W/2, sy=r=>(r.y-cam.y)*cam.s+H/2;
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#EEF1F6'; ctx.fillRect(0,0,W,H);
  const s=cam.s, rad=Math.max(2.6,Math.min(12,s*0.28));
  // arestas internas e entre países
  ctx.lineWidth=1;
  ctx.strokeStyle=view?'rgba(139,146,164,.10)':'rgba(139,146,164,.40)'; ctx.beginPath();
  for(const [a,b] of edges){ if(R[a].owner!==R[b].owner) continue; ctx.moveTo(sx(R[a]),sy(R[a])); ctx.lineTo(sx(R[b]),sy(R[b])); }
  ctx.stroke();
  ctx.strokeStyle=view?'rgba(68,74,90,.12)':'rgba(68,74,90,.55)'; ctx.setLineDash([3,3]); ctx.beginPath();
  for(const [a,b] of edges){ if(R[a].owner===R[b].owner) continue; ctx.moveTo(sx(R[a]),sy(R[a])); ctx.lineTo(sx(R[b]),sy(R[b])); }
  ctx.stroke(); ctx.setLineDash([]);
  if(view&&view.edges){ for(const [a,b,c,w] of view.edges){ ctx.strokeStyle=c; ctx.lineWidth=w||2.5; ctx.beginPath(); ctx.moveTo(sx(R[a]),sy(R[a])); ctx.lineTo(sx(R[b]),sy(R[b])); ctx.stroke(); } }
  // nós
  for(const r of R){
    const x=sx(r), y=sy(r); if(x<-20||y<-20||x>W+20||y>H+20) continue;
    const v=view?view.nodes.get(r.i):null;
    ctx.globalAlpha=(view&&!v)?0.16:1;
    ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fillStyle=(v&&v.fill)||nodeColor(r); ctx.fill();
    if(colorMode==='owner'&&r.owner!==r.rightful&&rad>4.5&&!(v&&v.fill)){ctx.lineWidth=2; ctx.strokeStyle=COL[r.rightful]; ctx.beginPath(); ctx.arc(x,y,rad+2,0,7); ctx.stroke();}
    if(r.capital){ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,Math.max(1.2,rad*.38),0,7); ctx.fill();}
    if(v&&v.ring){ctx.lineWidth=v.rw||2.5; ctx.strokeStyle=v.ring; ctx.beginPath(); ctx.arc(x,y,rad+(v.rw||2.5)+1.5,0,7); ctx.stroke();}
    if(r.i===hover){ctx.lineWidth=2; ctx.strokeStyle='#1A2540'; ctx.beginPath(); ctx.arc(x,y,rad+3,0,7); ctx.stroke();}
  }
  ctx.globalAlpha=1;
  // rótulos
  ctx.font='600 11px system-ui,sans-serif'; ctx.textAlign='center'; ctx.lineJoin='round';
  const showAll=allLabels||s>=34;

    const v=view?view.nodes.get(r.i):null;
    if(!((v&&v.label)||(allLabels&&(!view||v))||(showAll&&!view))) continue;
    const x=sx(r), y=sy(r)-rad-5; if(x<-80||y<-20||x>W+80||y>H+20) continue;

}
function pick(mx,my){
  const rad=Math.max(2.6,Math.min(12,cam.s*0.28))+5; let best=-1,bd=rad*rad;
  for(const r of R){const dx=sx(r)-mx, dy=sy(r)-my, d=dx*dx+dy*dy; if(d<bd){bd=d;best=r.i;}}
  return best;
}

const ptrs=new Map(); let dragMoved=false, lastPinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); dragMoved=false; cv.classList.add('drag');});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)){
    const p=ptrs.get(e.pointerId), dx=e.offsetX-p.x, dy=e.offsetY-p.y;
    if(ptrs.size===1){ if(Math.abs(dx)+Math.abs(dy)>2){dragMoved=true; userMoved=true;} cam.x-=dx/cam.s; cam.y-=dy/cam.s; }
    p.x=e.offsetX; p.y=e.offsetY;
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastPinch) zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/lastPinch); lastPinch=d; dragMoved=true; }
    tip.style.display='none'; redraw(); return;
  }
  const h=pick(e.offsetX,e.offsetY);
  if(h!==hover){hover=h; redraw();}
  if(h>=0){const r=R[h];
    tip.innerHTML=`<b>${esc(r.name)}</b> <small>#${r.id}</small><br>${esc(r.owner)}${r.owner!==r.rightful?` <small>(legítimo: ${esc(r.rightful)})</small>`:''}${r.capital?`<br><small>Capital de ${esc(r.capital)}</small>`:''}${r.res?`<br><small>Recurso: ${RESN[r.res]||esc(r.res)}</small>`:''}<br><small>${r.nb.length} vizinhos</small>`;
    tip.style.display='block'; const tx=Math.min(e.offsetX+14,W-270); tip.style.left=tx+'px'; tip.style.top=(e.offsetY+14)+'px';
  } else tip.style.display='none';
});
const endPtr=e=>{ptrs.delete(e.pointerId); lastPinch=0; if(!ptrs.size) cv.classList.remove('drag');};
cv.addEventListener('pointerup',e=>{const was=ptrs.size===1&&!dragMoved; endPtr(e); if(was){const h=pick(e.offsetX,e.offsetY); if(h>=0) selectRegion(h,false);}});
cv.addEventListener('pointercancel',endPtr);

function zoomAt(mx,my,f){ const wx=(mx-W/2)/cam.s+cam.x, wy=(my-H/2)/cam.s+cam.y; cam.s=Math.max(2,Math.min(160,cam.s*f)); cam.x=wx-(mx-W/2)/cam.s; cam.y=wy-(my-H/2)/cam.s; redraw(); }
cv.addEventListener('wheel',e=>{e.preventDefault(); userMoved=true; zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0015));},{passive:false});

function originInfo(){

  const i=findRegion(document.getElementById('oReg').value); if(i<0) return {err:'Região de origem não encontrada.'};

  const {dist,prev}=dijkstra(o.src,o.side,rMode);
  if(!isFinite(dist[t])){out.innerHTML=`<div class="verdict">Sem caminho terrestre até ${esc(R[t].name)}.</div>`; view=null; redraw(); return;}
  const path=[]; for(let u=t;u>=0;u=prev[u]) path.unshift(u);

   <ol class="path">${path.map((u,k)=>`<li>${rl(u)} — ${cdot(R[u].owner)} ${k===0?'<span class="tag own">ponto de partida</span>':o.side.has(R[u].owner)?'<span class="tag own">já é seu/aliado</span>':'<span class="tag">conquistar</span>'} ${resB(R[u].res)}</li>`).join('')}</ol>`;

const HEAT=['#1A2540','#C62828','#EA580C','#E0A800','#1B9E4B','#2563EB','#8B92A4'];
function runReach(){

  // custo = 1001 por região conquistada + 1 por salto em território próprio (<1000), logo nível = floor(d/1001)
  const lev=R.map(r=>{const d=dist[r.i]; return isFinite(d)?Math.floor(d/1001):-1;});
  const cnt={}; lev.forEach(k=>{k=Math.min(k,6); cnt[k]=(cnt[k]||0)+1;});
  const nodes=new Map(); lev.forEach((k,i)=>{if(k>=0) nodes.set(i,{fill:HEAT[Math.min(k,6)],label:k===1&&(cnt[1]||0)<=60});});
  const one=lev.map((k,i)=>k===1?i:-1).filter(i=>i>=0);
  out.innerHTML=`<div class="verdict">Alcance de <b>${esc(o.label)}</b>: cor = nº de conquistas necessárias para chegar à região.</div>
   <div style="margin-top:8px">${Object.keys(cnt).filter(k=>k>=0).sort((a,b)=>a-b).map(k=>`<div class="li"><span class="dot" style="background:${HEAT[Math.min(k,6)]}"></span> ${k==0?'território próprio/aliado':k==1?'1 conquista (fronteira direta)':k==6?'6+ conquistas':k+' conquistas'} — <b>${cnt[k]}</b></div>`).join('')}${cnt[-1]?`<div class="hint">Inalcançáveis: ${cnt[-1]}</div>`:''}</div>
   <h3>Fronteira direta (${one.length})</h3><div>${one.sort((a,b)=>R[a].owner.localeCompare(R[b].owner)).map(i=>`${rl(i)} <span class="hint">(${esc(R[i].owner)})</span>`).join(', ')}</div>`;
  view={nodes,edges:null,focus:R.filter((r,i)=>lev[i]>=0&&lev[i]<=2).map(r=>r.i)}; fit(view.focus);
}

   <div class="stats"><div><b>${n}</b><small>${ocMode==='ocupa'?'regiões ocupadas':'regiões perdidas'}</small></div><div><b>${g}</b><small>${ocMode==='ocupa'?'donos legítimos':'países ocupantes'}</small></div><div><b>${flagged}</b><small>${ocMode==='ocupa'?'na linha de frente':`com fronteira com ${esc(c)}`}</small></div></div>
   <div class="verdict">${ocMode==='ocupa'
     ?`${esc(c)} domina <b>${n}</b> regiões que não são legitimamente suas, de <b>${g}</b> países. <b>${flagged}</b> estão na linha de frente (encostam em outro país); ${n-flagged} estão cercadas só por território de ${esc(c)}.`
     :`<b>${n}</b> regiões legítimas de ${esc(c)} estão com <b>${g}</b> país(es). ${ownCount[c]?`${esc(c)} faz fronteira com <b>${flagged}</b> delas e pode atacar direto; ${n-flagged} exigem conquistar o caminho antes.`:`${esc(c)} não tem nenhuma região hoje, então não faz fronteira com nenhuma delas.`}`}</div>
   <p class="hint" style="margin:8px 0 0">Clique numa região para focá-la no mapa. Pílulas: <span class="pill f"><i class="dot" style="background:#EA580C"></i>outro país</span><span class="pill ${ocMode==='ocupa'?'o':'c'}"><i class="dot" style="background:${COL[c]}"></i>${esc(c)}</span> <a class="rg" id="ocAll">ver todas no mapa</a></p></div>`;
  gOrder.forEach(k=>{
    h+=`<h3>${ocMode==='ocupa'?'Legítimas de':'Ocupadas por'} ${cdot(k)} (${groups[k].length})</h3>`;
    groups[k].sort((a,b)=>R[a].name.localeCompare(R[b].name)).forEach(i=>{const L=nbList(i);
      h+=`<div class="oc" data-oci="${i}"><div class="t"><b data-oc="${i}">${esc(R[i].name)}</b>${R[i].res?resB(R[i].res):''}${R[i].capital?`<span class="badge b-pur">capital de ${esc(R[i].capital)}</span>`:''}${status(i)}<span style="margin-left:auto;font-size:11px;white-space:nowrap"><a class="rg" href="${GAME}${R[i].id}" target="_blank" rel="noopener">abrir no jogo ↗</a> · <a class="rg" data-r="${i}">detalhes</a></span></div>
        <div class="nbs"><span class="hint">Faz ponte com (${L.length}):</span><br>${L.map(pill).join('')||'<span class="hint">—</span>'}</div></div>`;});
  });
  h+=`<h3>Regiões-ponte de fora da lista (${bOrder.reduce((s,o)=>s+bByOwner[o].length,0)})</h3><p class="hint">Regiões que não estão entre as ${ocMode==='ocupa'?'ocupadas':'perdidas'}, mas encostam em pelo menos uma delas — agrupadas pelo dono atual.</p>
   <table><tr><th>Região-ponte</th><th>Encosta em</th></tr>${bOrder.map(o=>`<tr class="grp"><td colspan="2">${cdot(o)}${o===c?' (próprio país)':''} — ${bByOwner[o].length}</td></tr>`+bByOwner[o].sort((a,b)=>R[a].name.localeCompare(R[b].name)).map(v=>`<tr><td><a class="rg" data-oc="${v}">${esc(R[v].name)}</a>${R[v].res?' '+resB(R[v].res):''}</td><td>${bridges.get(v).map(i=>`<a class="rg" data-oc="${i}">${esc(R[i].name)}</a>`).join(', ')}</td></tr>`).join('')).join('')}</table>`;
  out.innerHTML=h;
  document.getElementById('ocAll').onclick=()=>{P.ocup.querySelectorAll('.oc.sel').forEach(x=>x.classList.remove('sel')); view=ocView(regs); fit(view.focus);};
  const rwTitle=ocMode==='ocupa'?`Regiões para abrir RW — ocupadas por ${c}`:`Regiões para abrir RW — legítimas de ${c}, ocupadas por outros`;
  const rwFile=`RW_${c.replace(/[^\w]+/g,'_')}_${ocMode==='ocupa'?'ocupadas':'perdidas'}_${D.date}`;
  document.getElementById('ocRW').onclick=()=>{
    const L=[rwTitle,`Dados de ${D.date} — os donos mudam com as guerras; confira no jogo antes.`,`${n} regiões`,''];
    gOrder.forEach(k=>{L.push(`[${ocMode==='ocupa'?'Legítimas de':'Ocupadas por'} ${k}] (${groups[k].length})`);
      groups[k].forEach(i=>L.push(`${R[i].name}${R[i].res?' ('+(RESN[R[i].res]||R[i].res)+')':''} — ${GAME}${R[i].id}`)); L.push('');});
    L.push('--- Só os links ---'); gOrder.forEach(k=>groups[k].forEach(i=>L.push(GAME+R[i].id)));
    downloadFile(rwFile+'.txt','\ufeff'+L.join('\r\n'),'text/plain;charset=utf-8');
  };
  document.getElementById('ocRWh').onclick=()=>{
    const body=gOrder.map(k=>`<h2>${ocMode==='ocupa'?'Legítimas de':'Ocupadas por'} ${esc(k)} (${groups[k].length})</h2><ul>${groups[k].map(i=>`<li><a href="${GAME}${R[i].id}" target="_blank" rel="noopener">${esc(R[i].name)}</a>${R[i].res?` <small>(${RESN[R[i].res]||esc(R[i].res)})</small>`:''}${R[i].capital?` <small>· capital de ${esc(R[i].capital)}</small>`:''}</li>`).join('')}</ul>`).join('');
    const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(rwTitle)}</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#444A5A;background:#fff}h1{color:#1A2540;font-size:20px}h2{color:#1A2540;font-size:15px;border-bottom:1px solid #D8DCE4;padding-bottom:4px;margin-top:22px}a{color:#2563EB}li{margin:3px 0}small{color:#8B92A4}.meta{color:#8B92A4;font-size:13px}</style></head><body><h1>${esc(rwTitle)}</h1><p class="meta">${n} regiões · dados de ${D.date} — os donos mudam com as guerras; confira no jogo antes.</p>${body}</body></html>`;
    downloadFile(rwFile+'.html',html,'text/html;charset=utf-8');
  };
  document.getElementById('ocCopy').onclick=e=>{
    const lines=[`${c} — ${ocMode==='ocupa'?`${n} regiões ocupadas (dono atual ≠ legítimo)`:`${n} regiões legítimas ocupadas por outros`} · dados de ${D.date}`];
    gOrder.forEach(k=>{lines.push('',`[${ocMode==='ocupa'?'Legítimas de':'Ocupadas por'} ${k}]`);
      groups[k].forEach(i=>lines.push(`• ${R[i].name}${R[i].res?' ('+(RESN[R[i].res]||R[i].res)+')':''} — pontes: ${nbList(i).map(v=>`${R[v].name} (${R[v].owner})`).join(', ')||'—'}`));});
    const txt=lines.join('\n'), btn=e.target;
    const ok=()=>{btn.textContent='Copiado ✓'; setTimeout(()=>btn.textContent='Copiar lista',1500);};
    function fallback(){const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok();}catch(_){} ta.remove();}
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok,fallback); else fallback();
  };
  view=ocView(regs); fit(view.focus);
}
P.ocup.addEventListener('click',e=>{
  const el=e.target.closest('[data-oc]'); if(!el) return; const i=+el.dataset.oc;
  P.ocup.querySelectorAll('.oc.sel').forEach(x=>x.classList.remove('sel'));
  if(ocRegs.includes(i)){const card=P.ocup.querySelector(`.oc[data-oci="${i}"]`); if(card) card.classList.add('sel'); view=ocView([i]);}
  else view=regionView(i);
  fit(view.focus,90);
});
ocOptions();

// ---------- início ----------
legend(); resize(); fit(ALL,30);
(function(){const m=location.hash.match(/^#(ocupa|perdeu)=(.+)$/); if(m){const c=decodeURIComponent(m[2]); if(allC.includes(c)) openOcup(m[1],c);}})();
</script>
</body>
</html>
